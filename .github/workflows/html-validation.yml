name: HTML Validation

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  htmlhint:
    name: Validate HTML Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run HTMLHint
        run: npx htmlhint **/*.html --ignore google*.html
