name: Code Quality Validation

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  linting:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Перевірка HTML
      - name: Run HTMLHint
        run: npx htmlhint **/*.html --ignore google*.html

      # 2. Перевірка CSS
      - name: Lint CSS
        run: |
          if ls *.css 1> /dev/null 2>&1; then
            npx stylelint "*.css" --allow-empty-input
          else
            echo "CSS файлів не знайдено, пропускаємо."
          fi
