name: Automated Weather Application Release

on:
  push:
    branches: [ "main" ] # Запускаємо тільки для головної гілки

jobs:
  release:
    name: Update Latest Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      # 1. Зчитуємо версію (наприклад, 1.7.0) з файлу index.html
      - name: Extract Version from index.html
        id: get_version
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('index.html', 'utf8');
            const match = html.match(/Версія:\s*([\d.]+)/i);
            
            if (!match) {
              console.error('Помилка: Не вдалося знайти версію в index.html!');
              process.exit(1);
            }
            
            const version = match[1];
            console.log('Знайдено версію проекту:', version);
            fs.appendFileSync(process.env.GITHUB_ENV, 'APP_VERSION=' + version + '\n');
          "

      # 2. Створюємо ZIP архів
      - name: Create Release ZIP Archive
        run: |
          zip -r weather-ukraine-v${{ env.APP_VERSION }}.zip . -x "*.git*" ".github*"

      # 3. НОВИЙ КРОК: Деплоїмо чисті файли сайту в публічний репозиторій (це запустить GitHub Pages)
      - name: Deploy static site to Public Repo
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          repository-name: antiruskontrol/BanderiZZation-Release
          branch: main # Пушимо у головну гілку публічного репозиторію
          folder: . # Беремо всі файли з поточного приватного репозиторію
          clean: true

      # 4. Публікуємо актуальний реліз вебдодатка разом із створеним архівом у ПУБЛІЧНИЙ репозиторій
      - name: Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Вказуємо шлях до нашого нового публічного репозиторію
          repository: antiruskontrol/BanderiZZation-Release
          
          # Використовуємо наш згенерований раніше секрет замість стандартного токена
          token: ${{ secrets.RELEASE_TOKEN }}
          
          files: weather-ukraine-v${{ env.APP_VERSION }}.zip
          name: WeatherInUkraine Build v${{ env.APP_VERSION }}
          tag_name: latest
          make_latest: "true"
          prerelease: false
          
          # Оскільки ми перезаписуємо реліз "latest", цей параметр дозволить оновлювати файли
          overwrite: true 
          
          body: |
            ## 🌤️ Актуальна стабільна збірка додатка WeatherInUkraine
            Поточна версія сторінки: **v${{ env.APP_VERSION }}** (WeatherScope Pro).

            ⏱️ _Останні зміни: ${{ github.event.head_commit.message }} (коміт ${{ github.sha }})_

            ### 📦 Інструкція:
            Цей архів містить повну резервну копію коду для версії **v${{ env.APP_VERSION }}**. 
            Ви можете завантажити його для локального тестування або розгортання вебсторінки на власному хостингу.
