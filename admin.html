<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адмін-панель — BanderiZZation</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .admin-container {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #3b82f6;
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
            display: none; /* Приховано за замовчуванням */
        }
        h2 { text-align: center; color: #38ff3b; margin-bottom: 20px; }
        label { display: block; margin-top: 15px; margin-bottom: 5px; color: #93c5fd; font-size: 0.9rem; }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            box-sizing: border-box;
        }
        select:focus, input:focus, textarea:focus { outline: none; border-color: #22c55e; box-shadow: 0 0 10px rgba(34, 197, 94, 0.5); }
        button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background: #22c55e; }
        .status { margin-top: 15px; text-align: center; font-size: 0.9rem; }
        
        /* Стилі для Drag & Drop */
        #dropZone {
            border: 2px dashed #3b82f6;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            margin: 20px 0;
            cursor: pointer;
            transition: background 0.3s;
            background: rgba(59, 130, 246, 0.05);
        }
        #dropZone:hover { background: rgba(59, 130, 246, 0.1); }
        #dropZone p { margin: 0; color: #93c5fd; }
        #dropZone span { font-size: 0.8rem; color: #64748b; }
        #uploadProgress { display: none; margin-top: 10px; }
        .progress-bg { background: #1e293b; border-radius: 8px; overflow: hidden; height: 20px; }
        #progressBar { background: #22c55e; width: 0%; height: 100%; transition: width 0.3s; }
    </style>
</head>
<body>

<div class="admin-container" id="adminPanel">
    <h2>🎬 Додати новий контент</h2>
    
    <label for="contentType">Тип контенту</label>
    <select id="contentType">
        <option value="movies">Фільм (Кіноскоп)</option>
        <option value="cartoons">Мультфільм (Мультоскоп)</option>
    </select>

    <label for="title">Назва</label>
    <input type="text" id="title" placeholder="Наприклад: Вавилон XX">

    <label for="description">Опис</label>
    <textarea id="description" rows="3" placeholder="Короткий опис..."></textarea>

    <label for="posterUrl">Посилання на постер (URL)</label>
    <input type="text" id="posterUrl" placeholder="https://raw.githubusercontent.com/.../poster.jpg">

    <!-- Зона Drag & Drop -->
    <label>Відеофайл (перетягніть сюди)</label>
    <div id="dropZone">
        <p>Перетягніть відеофайл сюди</p>
        <span>або натисніть, щоб вибрати</span>
        <input type="file" id="videoFileInput" accept="video/*" style="display: none;">
    </div>

    <div id="uploadProgress">
        <div class="progress-bg">
            <div id="progressBar"></div>
        </div>
        <p id="progressText" style="text-align: center; font-size: 0.8rem; margin-top: 5px;">0%</p>
    </div>

    <label for="videoFileName">Назва відеофайлу в Backblaze</label>
    <input type="text" id="videoFileName" placeholder="Заповниться автоматично після завантаження">

    <button id="saveBtn">Зберегти в базу</button>
    <div class="status" id="status"></div>
</div>

<script type="module">
    // === ПЕРЕВІРКА ПАРОЛЯ ===
    const CORRECT_PASSWORD = "9969";
    let enteredPassword = prompt("Введіть пароль для доступу до адмін-панелі:");

    if (enteredPassword === CORRECT_PASSWORD) {
        document.getElementById('adminPanel').style.display = 'block';
    } else {
        document.body.innerHTML = "<h1 style='color:red; text-align:center; margin-top:20%;'>Доступ заборонено</h1>";
        throw new Error("Неправильний пароль");
    }

    // === SUPABASE ===
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const SUPABASE_URL = 'https://bmwzzvrmkupwimhvzzqe.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_AlkDR5OTAyQjce5VYnLFOg_RlENaNLu';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const contentTypeSelect = document.getElementById('contentType');
    const saveBtn = document.getElementById('saveBtn');
    const statusDiv = document.getElementById('status');

    // === DRAG & DROP ТА ЗАВАНТАЖЕННЯ ===
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('videoFileInput');
    const progressContainer = document.getElementById('uploadProgress');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    const videoFileNameInput = document.getElementById('videoFileName');

    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => { if (e.target.files.length > 0) handleFileUpload(e.target.files[0]); });

    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.background = 'rgba(59, 130, 246, 0.2)'; });
    dropZone.addEventListener('dragleave', (e) => { e.preventDefault(); dropZone.style.background = 'rgba(59, 130, 246, 0.05)'; });
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.style.background = 'rgba(59, 130, 246, 0.05)';
        if (e.dataTransfer.files.length > 0) handleFileUpload(e.dataTransfer.files[0]);
    });

    async function handleFileUpload(file) {
        if (!file.type.startsWith('video/')) {
            alert('Будь ласка, виберіть відеофайл.');
            return;
        }

        progressContainer.style.display = 'block';
        progressBar.style.width = '0%';
        progressText.textContent = 'Завантажуємо на сервер...';
        dropZone.style.pointerEvents = 'none';

        const formData = new FormData();
        formData.append('video', file);
        formData.append('fileName', file.name);

        try {
            const xhr = new XMLHttpRequest();
            xhr.open('POST', 'https://banderizzation-backend.onrender.com/api/upload-video', true);

            xhr.upload.onprogress = (event) => {
                if (event.lengthComputable) {
                    const percent = Math.round((event.loaded / event.total) * 100);
                    progressBar.style.width = percent + '%';
                    progressText.textContent = percent + '%';
                }
            };

            xhr.onload = () => {
                if (xhr.status === 200) {
                    const response = JSON.parse(xhr.responseText);
                    progressText.textContent = 'Успішно завантажено!';
                    progressBar.style.background = '#22c55e';
                    videoFileNameInput.value = response.fileName;
                    
                    // Автозаповнення назви
                    let cleanTitle = response.fileName
                        .replace(/\.mp4$/i, '')
                        .replace(/_nologo$/i, '')
                        .replace(/_/g, ' ')
                        .trim();
                    document.getElementById('title').value = cleanTitle;

                    dropZone.style.pointerEvents = 'auto';
                } else {
                    progressText.textContent = 'Помилка сервера: ' + xhr.status;
                    progressBar.style.background = '#ef4444';
                    dropZone.style.pointerEvents = 'auto';
                }
            };

            xhr.onerror = () => {
                progressText.textContent = 'Помилка мережі';
                progressBar.style.background = '#ef4444';
                dropZone.style.pointerEvents = 'auto';
            };

            xhr.send(formData);

        } catch (error) {
            console.error(error);
            progressText.textContent = 'Помилка: ' + error.message;
            progressBar.style.background = '#ef4444';
            dropZone.style.pointerEvents = 'auto';
        }
    }

    // === ЗБЕРЕЖЕННЯ В БАЗУ ===
    saveBtn.addEventListener('click', async () => {
        const tableName = contentTypeSelect.value; // 'movies' або 'cartoons'
        const title = document.getElementById('title').value.trim();
        const description = document.getElementById('description').value.trim();
        const posterUrl = document.getElementById('posterUrl').value.trim();
        const videoFileName = document.getElementById('videoFileName').value.trim();

        if (!title || !videoFileName) {
            statusDiv.textContent = 'Заповніть хоча б Назву та Назву відеофайлу!';
            statusDiv.style.color = '#f87171';
            return;
        }

        saveBtn.disabled = true;
        statusDiv.textContent = 'Зберігаємо...';
        statusDiv.style.color = '#fff';

        const { error } = await supabase
            .from(tableName)
            .insert([{ 
                title: title, 
                description: description, 
                posterUrl: posterUrl, 
                videoFileName: videoFileName,
                views: 0,
                likes: 0
            }]);

        if (error) {
            console.error(error);
            statusDiv.textContent = 'Помилка: ' + error.message;
            statusDiv.style.color = '#f87171';
        } else {
            statusDiv.textContent = `Успішно додано в ${tableName === 'movies' ? 'Кіноскоп' : 'Мультоскоп'}!`;
            statusDiv.style.color = '#22c55e';
            // Очищаємо форму
            document.getElementById('title').value = '';
            document.getElementById('description').value = '';
            document.getElementById('posterUrl').value = '';
            document.getElementById('videoFileName').value = '';
            progressContainer.style.display = 'none';
        }
        saveBtn.disabled = false;
    });
</script>

</body>
</html>
