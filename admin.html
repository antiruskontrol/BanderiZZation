<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адмін-панель — BanderiZZation</title>
    <!--
    ===================================================================
    Версія:       2.4.0 (BanderiZZation! Hub — admin.html)
    Дата, час:    2026-10-30
    Розробник:    Афтіпа Марко Оцтович | antiruskontrol@ukr.net
    -------------------------------------------------------------------
    Еволюція змін:
     Зміни 2.4.0 відносно 2.3.0:
      1. У картку після завантаження додано поле "Назва".
      2. При збереженні картки title береться з поля БЕЗ cleanTitle
         (адмін має повний контроль над назвою).
      3. cleanTitle застосовується лише при створенні запису
         (після upload), як і раніше.
      4. Регулярка cleanTitle зроблена суворішою: logo/nologo/delogo
         видаляються лише як окремі токени (між роздільниками або
         на краях), щоб не різати легітимні слова типу "Logo Design".
      5. У списку "Керування файлами" назва показується як є (з БД).
    ===================================================================
    -->
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            box-sizing: border-box;
        }
        .admin-container {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #3b82f6;
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
            display: none;
        }
        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        h2 { margin: 0; color: #38ff3b; }
        .btn-manage {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-manage:hover { background: #b91c1c; }

        label { display: block; margin-top: 15px; margin-bottom: 5px; color: #93c5fd; font-size: 0.9rem; }
        select, input, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            box-sizing: border-box;
        }
        select:focus, input:focus, textarea:focus { outline: none; border-color: #22c55e; box-shadow: 0 0 10px rgba(34, 197, 94, 0.5); }

        #dropZone {
            border: 2px dashed #3b82f6;
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            margin: 20px 0;
            cursor: pointer;
            transition: background 0.3s;
            background: rgba(59, 130, 246, 0.05);
        }
        #dropZone:hover { background: rgba(59, 130, 246, 0.1); }
        #dropZone p { margin: 0; color: #93c5fd; font-size: 1.1rem; }
        #dropZone span { font-size: 0.85rem; color: #64748b; display: block; margin-top: 5px; }

        #uploadProgress { display: none; margin-top: 10px; }
        .progress-bg { background: #1e293b; border-radius: 8px; overflow: hidden; height: 20px; }
        #progressBar { background: #22c55e; width: 0%; height: 100%; transition: width 0.3s; }
        #progressText { text-align: center; font-size: 0.9rem; margin-top: 8px; color: #cbd5e1; }

        .uploaded-card {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid #475569;
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
            animation: fadeIn 0.5s;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .uploaded-card h3 { margin: 0 0 10px 0; color: #facc15; font-size: 1rem; }
        .uploaded-card label { margin-top: 10px; font-size: 0.8rem; }

        .card-actions { display: flex; gap: 10px; margin-top: 10px; }
        .card-actions button { flex: 1; padding: 8px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-save { background: #3b82f6; color: white; }
        .btn-save:hover { background: #2563eb; }
        .save-status { font-size: 0.8rem; text-align: center; margin-top: 5px; }

        /* --- Стилі для модального вікна --- */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); z-index: 1000; justify-content: center; align-items: center;
        }
        .modal-window {
            background: #1e293b; border: 1px solid #3b82f6; border-radius: 12px;
            width: 80%; max-width: 600px; height: 70vh; display: flex; flex-direction: column;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.5); resize: both; overflow: hidden;
        }
        .modal-header {
            background: #0f172a; padding: 10px 15px; display: flex; justify-content: space-between;
            align-items: center; border-bottom: 1px solid #3b82f6; cursor: move;
        }
        .modal-title { color: #facc15; font-weight: bold; }
        .window-controls { display: flex; gap: 10px; }
        .window-controls button {
            background: transparent; border: none; color: #fff; font-size: 1.2rem; cursor: pointer; padding: 0 5px;
        }
        .window-controls button:hover { color: #3b82f6; }

        .modal-body { padding: 15px; overflow-y: auto; flex: 1; }
        .file-list { list-style: none; padding: 0; margin: 0; }
        .file-item {
            display: flex; align-items: center; padding: 8px; border-bottom: 1px solid #334155;
            transition: background 0.2s; cursor: pointer;
        }
        .file-item:hover { background: #334155; }
        .file-item input[type="checkbox"] { margin-right: 15px; width: 18px; height: 18px; cursor: pointer; }
        .file-info { flex: 1; }
        .file-info strong { display: block; color: #fff; }
        .file-info span { font-size: 0.8rem; color: #94a3b8; }

        .modal-footer {
            padding: 15px; border-top: 1px solid #3b82f6; display: flex; justify-content: flex-end; gap: 10px;
        }
        .modal-footer button { padding: 8px 20px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; }
        .btn-cancel { background: #475569; color: white; }
        .btn-delete-selected { background: #ef4444; color: white; }
        .btn-delete-selected:hover { background: #b91c1c; }
    </style>
</head>
<body>

<div class="admin-container" id="adminPanel">
    <div class="header-actions">
        <h2>📦 Завантаження контенту</h2>
        <button class="btn-manage" id="openManageBtn">🗑️ Керування файлами</button>
    </div>

    <label for="contentType">Тип контенту</label>
    <select id="contentType">
        <option value="movies">Фільм (Кіноскоп)</option>
        <option value="cartoons">Мультфільм (Мультоскоп)</option>
    </select>

    <div id="dropZone">
        <p>Перетягніть відеофайли сюди</p>
        <span>Можна вибрати відразу декілька (вони стануть у чергу)</span>
        <input type="file" id="videoFileInput" accept="video/*" multiple style="display: none;">
    </div>

    <div id="uploadProgress">
        <div class="progress-bg">
            <div id="progressBar"></div>
        </div>
        <p id="progressText">0%</p>
    </div>

    <div id="uploadedCardsContainer"></div>
</div>

<!-- Модальне вікно керування файлами -->
<div class="modal-overlay" id="manageModal">
    <div class="modal-window" id="modalWindow">
        <div class="modal-header" id="modalHeader">
            <div class="modal-title">Керування файлами</div>
            <div class="window-controls">
                <button id="minimizeBtn" title="Згорнути">_</button>
                <button id="maximizeBtn" title="Розгорнути">□</button>
                <button id="closeModalBtn" title="Закрити">✕</button>
            </div>
        </div>
        <div class="modal-body">
            <p id="modalStatus" style="color: #94a3b8; margin-top: 0;">Завантаження списку...</p>
            <ul class="file-list" id="fileList"></ul>
        </div>
        <div class="modal-footer">
            <button class="btn-cancel" id="cancelModalBtn">Скасувати</button>
            <button class="btn-delete-selected" id="deleteSelectedBtn">Видалити обрані</button>
        </div>
    </div>
</div>

<script type="module">
    const CORRECT_PASSWORD = "9969";
    let enteredPassword = prompt("Введіть пароль для доступу до адмін-панелі:");
    if (enteredPassword !== CORRECT_PASSWORD) {
        document.body.innerHTML = "<h1 style='color:red; text-align:center; margin-top:20%;'>Доступ заборонено</h1>";
        throw new Error("Неправильний пароль");
    }
    document.getElementById('adminPanel').style.display = 'block';

    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const SUPABASE_URL = 'https://bmwzzvrmkupwimhvzzqe.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_AlkDR5OTAyQjce5VYnLFOg_RlENaNLu';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const contentTypeSelect = document.getElementById('contentType');
    const openManageBtn = document.getElementById('openManageBtn');
    const manageModal = document.getElementById('manageModal');
    const modalWindow = document.getElementById('modalWindow');
    const modalHeader = document.getElementById('modalHeader');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const cancelModalBtn = document.getElementById('cancelModalBtn');
    const minimizeBtn = document.getElementById('minimizeBtn');
    const maximizeBtn = document.getElementById('maximizeBtn');
    const fileList = document.getElementById('fileList');
    const modalStatus = document.getElementById('modalStatus');
    const deleteSelectedBtn = document.getElementById('deleteSelectedBtn');
    const dropZone = document.getElementById('dropZone');
    const videoFileInput = document.getElementById('videoFileInput');
    const uploadedCardsContainer = document.getElementById('uploadedCardsContainer');

    // === ФУНКЦІЯ ОЧИЩЕННЯ НАЗВИ (суворіша регулярка) ===
    // Застосовується ЛИШЕ при автоматичному створенні запису (після upload).
    // При ручному збереженні картки title береться як є (Варіант Б).
    function cleanTitle(rawTitle) {
        if (!rawTitle) return 'Без назви';
        return rawTitle
            .replace(/\.(mp4|mkv|avi|mov)$/i, '')                 // розширення
            .replace(/(^|[_\s-])(no|de)?logo([_\s-]|$)/gi, '$1') // logo/nologo/delogo лише як токен
            .replace(/_/g, ' ')                                  // всі підкреслення -> пробіли
            .replace(/\s+/g, ' ')                                // подвійні пробіли
            .trim();
    }

    // === ЧЕРГА ЗАВАНТАЖЕННЯ ===
    let uploadQueue = [];
    let isUploading = false;

    dropZone.addEventListener('click', () => videoFileInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.background = 'rgba(59, 130, 246, 0.15)'; });
    dropZone.addEventListener('dragleave', () => { dropZone.style.background = 'rgba(59, 130, 246, 0.05)'; });
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.style.background = 'rgba(59, 130, 246, 0.05)';
        enqueueFiles(e.dataTransfer.files);
    });
    videoFileInput.addEventListener('change', (e) => {
        enqueueFiles(e.target.files);
        videoFileInput.value = '';
    });

    function enqueueFiles(fileListObj) {
        const files = Array.from(fileListObj).filter(f => f.type.startsWith('video/'));
        if (files.length === 0) return;
        uploadQueue.push(...files);
        processQueue();
    }

    async function processQueue() {
        if (isUploading) return;
        isUploading = true;
        while (uploadQueue.length > 0) {
            const file = uploadQueue.shift();
            await handleFileUpload(file);
        }
        isUploading = false;
    }

    // === ЗАВАНТАЖЕННЯ ТА СТВОРЕННЯ КАРТКИ ===
    async function handleFileUpload(file) {
        const progressContainer = document.getElementById('uploadProgress');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');

        progressContainer.style.display = 'block';
        progressBar.style.width = '0%';
        progressBar.style.background = '#22c55e';
        progressText.textContent = `Завантажуємо: ${file.name}`;

        const formData = new FormData();
        formData.append('video', file);
        formData.append('fileName', file.name);

        try {
            const xhr = new XMLHttpRequest();
            xhr.open('POST', 'https://banderizzation-backend.onrender.com/api/upload-video', true);

            xhr.upload.onprogress = (event) => {
                if (event.lengthComputable) {
                    const percent = Math.round((event.loaded / event.total) * 100);
                    progressBar.style.width = percent + '%';
                    progressText.textContent = `Завантажуємо (${percent}%): ${file.name}`;
                }
            };

            xhr.onload = async () => {
                if (xhr.status === 200) {
                    const response = JSON.parse(xhr.responseText);
                    // Автоматична назва — очищаємо
                    let cleanTitleText = cleanTitle(file.name);

                    const tableName = contentTypeSelect.value;
                    const { data, error } = await supabase
                        .from(tableName)
                        .insert([{
                            title: cleanTitleText,
                            description: '',
                            posterUrl: '',
                            videoFileName: response.fileName,
                            views: 0,
                            likes: 0
                        }])
                        .select();

                    if (error) {
                        console.error('Помилка створення запису:', error);
                        progressText.textContent = `Помилка бази для ${file.name}`;
                        progressBar.style.background = '#ef4444';
                    } else {
                        createEditCard(data[0], tableName);
                        progressText.textContent = `Успішно завантажено: ${cleanTitleText}`;
                    }
                } else {
                    progressText.textContent = `Помилка завантаження: ${xhr.status}`;
                    progressBar.style.background = '#ef4444';
                }
            };

            xhr.onerror = () => {
                progressText.textContent = `Помилка мережі`;
                progressBar.style.background = '#ef4444';
            };

            xhr.send(formData);

        } catch (error) {
            console.error(error);
            progressText.textContent = 'Помилка: ' + error.message;
            progressBar.style.background = '#ef4444';
        }
    }

    // === КАРТКА РЕДАГУВАННЯ ===
    function createEditCard(record, tableName) {
        const card = document.createElement('div');
        card.className = 'uploaded-card';
        card.dataset.id = record.id;
        card.dataset.table = tableName;

        card.innerHTML = `
            <h3>🎬 ${record.title}</h3>
            <label>Назва</label>
            <input type="text" class="card-title-input" value="${(record.title || '').replace(/"/g, '&quot;')}">
            <label>Опис</label>
            <textarea class="card-desc-input" rows="2">${record.description || ''}</textarea>
            <label>Постер (URL)</label>
            <input type="text" class="card-poster-input" value="${(record.posterUrl || '').replace(/"/g, '&quot;')}">
            <div class="card-actions">
                <button class="btn-save">💾 Зберегти</button>
            </div>
            <div class="save-status"></div>
        `;

        const titleInput = card.querySelector('.card-title-input');
        const descInput = card.querySelector('.card-desc-input');
        const posterInput = card.querySelector('.card-poster-input');
        const saveBtn = card.querySelector('.btn-save');
        const statusEl = card.querySelector('.save-status');

        saveBtn.addEventListener('click', async () => {
            saveBtn.disabled = true;
            statusEl.textContent = 'Збереження...';
            statusEl.style.color = '#94a3b8';

            // Варіант Б: title беремо як є, БЕЗ cleanTitle
            const { error } = await supabase
                .from(tableName)
                .update({
                    title: titleInput.value,
                    description: descInput.value,
                    posterUrl: posterInput.value
                })
                .eq('id', record.id);

            if (error) {
                console.error('Помилка збереження:', error);
                statusEl.textContent = 'Помилка: ' + error.message;
                statusEl.style.color = '#ef4444';
            } else {
                statusEl.textContent = '✅ Збережено';
                statusEl.style.color = '#22c55e';
                card.querySelector('h3').textContent = `🎬 ${titleInput.value}`;
            }
            saveBtn.disabled = false;
        });

        uploadedCardsContainer.prepend(card);
    }

    // === КЕРУВАННЯ ВІКНОМ ===
    openManageBtn.addEventListener('click', async () => {
        manageModal.style.display = 'flex';
        modalWindow.style.width = '80%';
        modalWindow.style.height = '70vh';
        await loadFilesForManagement();
    });

    function closeModal() {
        manageModal.style.display = 'none';
        fileList.innerHTML = '';
        modalStatus.textContent = 'Завантаження списку...';
    }

    closeModalBtn.addEventListener('click', closeModal);
    cancelModalBtn.addEventListener('click', closeModal);

    let isMinimized = false;
    minimizeBtn.addEventListener('click', () => {
        isMinimized = !isMinimized;
        modalWindow.style.height = isMinimized ? '50px' : '70vh';
        minimizeBtn.textContent = isMinimized ? '□' : '_';
    });

    let isMaximized = false;
    maximizeBtn.addEventListener('click', () => {
        isMaximized = !isMaximized;
        modalWindow.style.width = isMaximized ? '100%' : '80%';
        modalWindow.style.height = isMaximized ? '100%' : '70vh';
        modalWindow.style.borderRadius = isMaximized ? '0' : '12px';
        maximizeBtn.textContent = isMaximized ? '❐' : '□';
    });

    // === ЛОГІКА ЗАВАНТАЖЕННЯ СПИСКУ ===
    async function loadFilesForManagement() {
        const tableName = contentTypeSelect.value;
        modalStatus.textContent = 'Завантаження...';
        fileList.innerHTML = '';

        const { data, error } = await supabase
            .from(tableName)
            .select('id, title, videoFileName')
            .order('title', { ascending: true });

        if (error) {
            modalStatus.textContent = 'Помилка завантаження списку.';
            return;
        }

        if (!data || data.length === 0) {
            modalStatus.textContent = 'У цій таблиці ще немає файлів.';
            return;
        }

        modalStatus.textContent = `Знайдено файлів: ${data.length}`;

        data.forEach(item => {
            const li = document.createElement('li');
            li.className = 'file-item';
            const safeTitle = (item.title || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            const safeFile = (item.videoFileName || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            li.innerHTML = `
                <input type="checkbox" value="${item.id}" data-filename="${safeFile}">
                <div class="file-info">
                    <strong>${safeTitle}</strong>
                    <span>${safeFile}</span>
                </div>
            `;
            fileList.appendChild(li);
        });
    }

    // === ЛОГІКА ВИДАЛЕННЯ ===
    deleteSelectedBtn.addEventListener('click', async () => {
        const checkboxes = fileList.querySelectorAll('input[type="checkbox"]:checked');
        if (checkboxes.length === 0) {
            alert('Будь ласка, оберіть хоча б один файл для видалення.');
            return;
        }

        if (!confirm(`Ви впевнені, що хочете видалити ${checkboxes.length} файлів? Вони будуть видалені як з бази, так і з Backblaze.`)) {
            return;
        }

        deleteSelectedBtn.disabled = true;
        modalStatus.textContent = 'Видалення...';

        const tableName = contentTypeSelect.value;
        let successCount = 0;
        let errorCount = 0;

        try {
            for (const cb of checkboxes) {
                const id = cb.value;
                const fileName = cb.dataset.filename;

                try {
                    if (fileName) {
                        const response = await fetch(`https://banderizzation-backend.onrender.com/api/delete-video?fileName=${encodeURIComponent(fileName)}`, {
                            method: 'DELETE'
                        });
                        if (!response.ok) throw new Error('Помилка B2');
                    }

                    const { error } = await supabase.from(tableName).delete().eq('id', id);
                    if (error) throw error;

                    successCount++;
                    cb.closest('.file-item').remove();
                } catch (error) {
                    console.error(`Помилка видалення ${fileName}:`, error);
                    errorCount++;
                }
            }
        } finally {
            deleteSelectedBtn.disabled = false;
            modalStatus.textContent = `Видалено: ${successCount}. Помилок: ${errorCount}.`;
        }
    });
</script>

</body>
</html>
