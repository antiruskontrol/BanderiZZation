<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адмін-панель — BanderiZZation</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            box-sizing: border-box;
        }
        .admin-container {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #3b82f6;
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
            display: none;
        }
        h2 { text-align: center; color: #38ff3b; margin-bottom: 20px; }
        label { display: block; margin-top: 15px; margin-bottom: 5px; color: #93c5fd; font-size: 0.9rem; }
        select, input, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            box-sizing: border-box;
        }
        select:focus, input:focus, textarea:focus { outline: none; border-color: #22c55e; box-shadow: 0 0 10px rgba(34, 197, 94, 0.5); }
        
        /* Зона Drag & Drop */
        #dropZone {
            border: 2px dashed #3b82f6;
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            margin: 20px 0;
            cursor: pointer;
            transition: background 0.3s;
            background: rgba(59, 130, 246, 0.05);
        }
        #dropZone:hover { background: rgba(59, 130, 246, 0.1); }
        #dropZone p { margin: 0; color: #93c5fd; font-size: 1.1rem; }
        #dropZone span { font-size: 0.85rem; color: #64748b; display: block; margin-top: 5px; }
        
        /* Прогрес-бар */
        #uploadProgress { display: none; margin-top: 10px; }
        .progress-bg { background: #1e293b; border-radius: 8px; overflow: hidden; height: 20px; }
        #progressBar { background: #22c55e; width: 0%; height: 100%; transition: width 0.3s; }
        #progressText { text-align: center; font-size: 0.9rem; margin-top: 8px; color: #cbd5e1; }

        /* Картки завантажених файлів */
        .uploaded-card {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid #475569;
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
            animation: fadeIn 0.5s;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .uploaded-card h3 { margin: 0 0 10px 0; color: #facc15; font-size: 1rem; }
        .uploaded-card label { margin-top: 10px; font-size: 0.8rem; }
        .uploaded-card button {
            margin-top: 10px;
            width: 100%;
            padding: 8px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .uploaded-card button:hover { background: #2563eb; }
        .uploaded-card button:disabled { background: #475569; cursor: not-allowed; }
        .save-status { font-size: 0.8rem; text-align: center; margin-top: 5px; }
    </style>
</head>
<body>

<div class="admin-container" id="adminPanel">
    <h2>📦 Завантаження контенту</h2>
    
    <label for="contentType">Тип контенту</label>
    <select id="contentType">
        <option value="movies">Фільм (Кіноскоп)</option>
        <option value="cartoons">Мультфільм (Мультоскоп)</option>
    </select>

    <!-- Зона Drag & Drop -->
    <div id="dropZone">
        <p>Перетягніть відеофайли сюди</p>
        <span>Можна вибрати відразу декілька (вони стануть у чергу)</span>
        <input type="file" id="videoFileInput" accept="video/*" multiple style="display: none;">
    </div>

    <div id="uploadProgress">
        <div class="progress-bg">
            <div id="progressBar"></div>
        </div>
        <p id="progressText">0%</p>
    </div>

    <!-- Сюди додаватимуться картки -->
    <div id="uploadedCardsContainer"></div>
</div>

<script type="module">
    const CORRECT_PASSWORD = "9969";
    let enteredPassword = prompt("Введіть пароль для доступу до адмін-панелі:");
    if (enteredPassword !== CORRECT_PASSWORD) {
        document.body.innerHTML = "<h1 style='color:red; text-align:center; margin-top:20%;'>Доступ заборонено</h1>";
        throw new Error("Неправильний пароль");
    }
    document.getElementById('adminPanel').style.display = 'block';

    // === SUPABASE ===
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const SUPABASE_URL = 'https://bmwzzvrmkupwimhvzzqe.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_AlkDR5OTAyQjce5VYnLFOg_RlENaNLu';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const contentTypeSelect = document.getElementById('contentType');
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('videoFileInput');
    const progressContainer = document.getElementById('uploadProgress');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    const cardsContainer = document.getElementById('uploadedCardsContainer');

    let fileQueue = [];
    let isProcessing = false;

    // === DRAG & DROP ===
    dropZone.addEventListener('click', () => fileInput.click());
    
    fileInput.addEventListener('change', (e) => { 
        if (e.target.files.length > 0) {
            addFilesToQueue(Array.from(e.target.files));
        }
    });

    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.background = 'rgba(59, 130, 246, 0.2)'; });
    dropZone.addEventListener('dragleave', (e) => { e.preventDefault(); dropZone.style.background = 'rgba(59, 130, 246, 0.05)'; });
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.style.background = 'rgba(59, 130, 246, 0.05)';
        if (e.dataTransfer.files.length > 0) {
            addFilesToQueue(Array.from(e.dataTransfer.files));
        }
    });

    function addFilesToQueue(files) {
        const validFiles = files.filter(f => f.type.startsWith('video/'));
        if (validFiles.length === 0) return alert('Будь ласка, виберіть відеофайли.');

        fileQueue.push(...validFiles);
        progressText.textContent = `У черзі: ${fileQueue.length} файлів...`;
        progressContainer.style.display = 'block';
        
        if (!isProcessing) processQueue();
    }

    // === ЧЕРГА ЗАВАНТАЖЕННЯ ===
    async function processQueue() {
        if (fileQueue.length === 0) {
            isProcessing = false;
            progressText.textContent = 'Усі файли успішно оброблено!';
            progressBar.style.width = '100%';
            setTimeout(() => { progressContainer.style.display = 'none'; }, 3000);
            return;
        }

        isProcessing = true;
        const file = fileQueue.shift();
        
        progressBar.style.width = '0%';
        progressBar.style.background = '#22c55e';
        progressText.textContent = `Залишилось: ${fileQueue.length}. Завантажуємо: ${file.name}`;

        const formData = new FormData();
        formData.append('video', file);
        formData.append('fileName', file.name);

        try {
            const xhr = new XMLHttpRequest();
            xhr.open('POST', 'https://banderizzation-backend.onrender.com/api/upload-video', true);

            xhr.upload.onprogress = (event) => {
                if (event.lengthComputable) {
                    const percent = Math.round((event.loaded / event.total) * 100);
                    progressBar.style.width = percent + '%';
                    progressText.textContent = `Завантажуємо (${percent}%): ${file.name}`;
                }
            };

            xhr.onload = async () => {
                if (xhr.status === 200) {
                    const response = JSON.parse(xhr.responseText);
                    let cleanTitle = file.name.replace(/\.mp4$/i, '').replace(/_nologo$/i, '').replace(/_/g, ' ').trim();

                    // Створюємо запис і отримуємо ID
                    const tableName = contentTypeSelect.value;
                    const { data, error } = await supabase
                        .from(tableName)
                        .insert([{ 
                            title: cleanTitle, 
                            description: '', 
                            posterUrl: '', 
                            videoFileName: response.fileName,
                            views: 0,
                            likes: 0
                        }])
                        .select();

                    if (error) {
                        console.error('Помилка створення запису:', error);
                        progressText.textContent = `Помилка бази для ${file.name}`;
                        progressBar.style.background = '#ef4444';
                    } else {
                        // Створюємо картку для редагування
                        createEditCard(data[0], tableName);
                        progressText.textContent = `Успішно завантажено: ${file.name}`;
                    }
                } else {
                    progressText.textContent = `Помилка завантаження: ${xhr.status}`;
                    progressBar.style.background = '#ef4444';
                }
                // Запускаємо наступний файл у черзі
                processQueue();
            };

            xhr.onerror = () => {
                progressText.textContent = `Помилка мережі`;
                progressBar.style.background = '#ef4444';
                processQueue(); // Продовжуємо чергу навіть при помилці
            };

            xhr.send(formData);

        } catch (error) {
            console.error(error);
            progressText.textContent = 'Помилка: ' + error.message;
            progressBar.style.background = '#ef4444';
            processQueue();
        }
    }

    // === СТВОРЕННЯ КАРТКИ ДЛЯ РЕДАГУВАННЯ ===
    function createEditCard(record, tableName) {
        const card = document.createElement('div');
        card.className = 'uploaded-card';
        card.id = `card-${record.id}`;

        card.innerHTML = `
            <h3>${record.title}</h3>
            
            <label>Опис</label>
            <textarea class="edit-desc" rows="2" placeholder="Додайте опис...">${record.description || ''}</textarea>
            
            <label>Постер (URL)</label>
            <input type="text" class="edit-poster" placeholder="https://.../poster.jpg" value="${record.posterUrl || ''}">
            
            <button class="save-btn">Зберегти зміни</button>
            <div class="save-status"></div>
        `;

        const saveBtn = card.querySelector('.save-btn');
        const statusEl = card.querySelector('.save-status');
        const descInput = card.querySelector('.edit-desc');
        const posterInput = card.querySelector('.edit-poster');

        saveBtn.addEventListener('click', async () => {
            saveBtn.disabled = true;
            statusEl.textContent = 'Зберігаємо...';
            statusEl.style.color = '#fff';

            const { error } = await supabase
                .from(tableName)
                .update({ 
                    description: descInput.value.trim(), 
                    posterUrl: posterInput.value.trim() 
                })
                .eq('id', record.id);

            if (error) {
                console.error('Помилка оновлення:', error);
                statusEl.textContent = 'Помилка збереження';
                statusEl.style.color = '#f87171';
                saveBtn.disabled = false;
            } else {
                statusEl.textContent = 'Успішно збережено!';
                statusEl.style.color = '#22c55e';
                // Кнопку залишаємо disabled, щоб уникнути повторних натискань
            }
        });

        // Додаємо нову картку на початок списку
        cardsContainer.prepend(card);
    }
</script>

</body>
</html>
