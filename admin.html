<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адмін-панель — BanderiZZation</title>
    <!--
    ===================================================================
    Версія:       2.7.0 (BanderiZZation! Hub — admin.html)
    Дата, час:    2026-11-01

     Зміни 2.7.0 відносно 2.6.0:
      1. Пряме завантаження відео в B2 (через Presigned URL).
      2. Виправлено синтаксичні помилки.
      3. Додано перевірку наявності елементів.
    ===================================================================

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center; 
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .login-container {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #3b82f6;
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
            text-align: center;
        }
        .login-container h2 { color: #38ff3b; margin-top: 0; }
        
        .admin-container {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #3b82f6;
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
            display: none;
        }
        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        h2 { margin: 0; color: #38ff3b; }
        .btn-manage {
            background: #ef4444; color: white; border: none; padding: 8px 15px;
            border-radius: 8px; font-weight: bold; cursor: pointer;
        }
        .btn-logout {
            background: #475569; color: white; border: none; padding: 8px 15px;
            border-radius: 8px; font-weight: bold; cursor: pointer; margin-left: 10px;
        }
        label { display: block; margin-top: 15px; margin-bottom: 5px; color: #93c5fd; font-size: 0.9rem; text-align: left;}
        select, input, textarea {
            width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.5); color: #fff; box-sizing: border-box;
        }
        select:focus, input:focus, textarea:focus { outline: none; border-color: #22c55e; }
        .btn-login {
            width: 100%; padding: 12px; margin-top: 20px; background: #22c55e; color: white;
            border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer;
        }
        .btn-login:hover { background: #16a34a; }

        #dropZone {
            border: 2px dashed #3b82f6; border-radius: 12px; padding: 30px 20px;
            text-align: center; margin: 20px 0; cursor: pointer; background: rgba(59, 130, 246, 0.05);
        }
        #dropZone p { margin: 0; color: #93c5fd; font-size: 1.1rem; }
        #uploadProgress { display: none; margin-top: 10px; }
        .progress-bg { background: #1e293b; border-radius: 8px; overflow: hidden; height: 20px; }
        #progressBar { background: #22c55e; width: 0%; height: 100%; transition: width 0.3s; }
        #progressText { text-align: center; font-size: 0.9rem; margin-top: 8px; color: #cbd5e1; }
        .uploaded-card {
            background: rgba(30, 41, 59, 0.8); border: 1px solid #475569;
            border-radius: 12px; padding: 15px; margin-top: 15px;
        }
        .uploaded-card h3 { margin: 0 0 10px 0; color: #facc15; font-size: 1rem; }
        .card-actions { display: flex; gap: 10px; margin-top: 10px; }
        .card-actions button { flex: 1; padding: 8px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-save { background: #3b82f6; color: white; }
        .save-status { font-size: 0.8rem; text-align: center; margin-top: 5px; }

        .poster-drop-zone {
            border: 2px dashed #475569; border-radius: 8px; padding: 15px;
            text-align: center; cursor: pointer; margin-bottom: 10px; transition: background 0.2s;
        }
        .poster-drop-zone:hover { background: rgba(59, 130, 246, 0.1); border-color: #3b82f6; }
        .poster-status-text { color: #94a3b8; font-size: 0.9rem; }

        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); z-index: 1000; justify-content: center; align-items: center;
        }
        .modal-window {
            background: #1e293b; border: 1px solid #3b82f6; border-radius: 12px;
            width: 80%; max-width: 600px; height: 70vh; display: flex; flex-direction: column;
        }
        .modal-header {
            background: #0f172a; padding: 10px 15px; display: flex; justify-content: space-between;
            align-items: center; border-bottom: 1px solid #3b82f6;
        }
        .modal-title { color: #facc15; font-weight: bold; }
        .window-controls button { background: transparent; border: none; color: #fff; font-size: 1.2rem; cursor: pointer; }
        .modal-body { padding: 15px; overflow-y: auto; flex: 1; }
        .file-list { list-style: none; padding: 0; margin: 0; }
        .file-item { display: flex; align-items: center; padding: 8px; border-bottom: 1px solid #334155; }
        .file-item input[type="checkbox"] { margin-right: 15px; width: 18px; height: 18px; }
        .file-info strong { display: block; color: #fff; }
        .file-info span { font-size: 0.8rem; color: #94a3b8; }
        .modal-footer { padding: 15px; border-top: 1px solid #3b82f6; display: flex; justify-content: flex-end; gap: 10px; }
        .modal-footer button { padding: 8px 20px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; }
        .btn-cancel { background: #475569; color: white; }
        .btn-delete-selected { background: #ef4444; color: white; }
    </style>
</head>
<body>

<!-- ФОРМА ВХОДУ -->
<div class="login-container" id="loginPanel">
    <h2>🔐 Вхід в адмінку</h2>
    <p style="color: #94a3b8; font-size: 0.9rem;">Введіть email та пароль адміністратора</p>
    
    <label for="loginEmail">Email</label>
    <input type="email" id="loginEmail" placeholder="admin@example.com">
    
    <label for="loginPassword">Пароль</label>
    <input type="password" id="loginPassword" placeholder="••••••••">
    
    <button class="btn-login" id="loginBtn">Увійти</button>
    <p id="loginError" style="color: #ef4444; font-size: 0.9rem; margin-top: 10px; display: none;"></p>
</div>

<!-- АДМІНКА -->
<div class="admin-container" id="adminPanel">
    <div class="header-actions">
        <h2>📦 Завантаження контенту</h2>
        <div>
            <button class="btn-manage" id="openManageBtn">🗑️ Керування</button>
            <button class="btn-logout" id="logoutBtn">Вийти</button>
        </div>
    </div>
    
    <label for="contentType">Тип контенту</label>
    <select id="contentType">
        <option value="movies">Фільм (Кіноскоп)</option>
        <option value="cartoons">Мультфільм (Мультоскоп)</option>
    </select>

    <div id="dropZone">
        <p>Перетягніть відеофайли сюди</p>
        <span>Можна вибрати відразу декілька</span>
        <input type="file" id="videoFileInput" accept="video/*" multiple style="display: none;">
    </div>

    <div id="uploadProgress">
        <div class="progress-bg"><div id="progressBar"></div></div>
        <p id="progressText">0%</p>
    </div>

    <div id="uploadedCardsContainer"></div>
</div>

<!-- Модальне вікно керування -->
<div class="modal-overlay" id="manageModal">
    <div class="modal-window" id="modalWindow">
        <div class="modal-header" id="modalHeader">
            <div class="modal-title">Керування файлами</div>
            <div class="window-controls">
                <button id="minimizeBtn" title="Згорнути">_</button>
                <button id="maximizeBtn" title="Розгорнути">□</button>
                <button id="closeModalBtn" title="Закрити">✕</button>
            </div>
        </div>
        <div class="modal-body">
            <p id="modalStatus" style="color: #94a3b8; margin-top: 0;">Завантаження списку...</p>
            <ul class="file-list" id="fileList"></ul>
        </div>
        <div class="modal-footer">
            <button class="btn-cancel" id="cancelModalBtn">Скасувати</button>
            <button class="btn-delete-selected" id="deleteSelectedBtn">Видалити обрані</button>
        </div>
    </div>
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const SUPABASE_URL = 'https://bmwzzvrmkupwimhvzzqe.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_AlkDR5OTAyQjce5VYnLFOg_RlENaNLu';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Елементи
    const loginPanel = document.getElementById('loginPanel');
    const adminPanel = document.getElementById('adminPanel');
    const loginEmail = document.getElementById('loginEmail');
    const loginPassword = document.getElementById('loginPassword');
    const loginBtn = document.getElementById('loginBtn');
    const loginError = document.getElementById('loginError');
    const logoutBtn = document.getElementById('logoutBtn');

    const contentTypeSelect = document.getElementById('contentType');
    const openManageBtn = document.getElementById('openManageBtn');
    const manageModal = document.getElementById('manageModal');
    const modalWindow = document.getElementById('modalWindow');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const cancelModalBtn = document.getElementById('cancelModalBtn');
    const minimizeBtn = document.getElementById('minimizeBtn');
    const maximizeBtn = document.getElementById('maximizeBtn');
    const fileList = document.getElementById('fileList');
    const modalStatus = document.getElementById('modalStatus');
    const deleteSelectedBtn = document.getElementById('deleteSelectedBtn');
    const dropZone = document.getElementById('dropZone');
    const videoFileInput = document.getElementById('videoFileInput');
    const uploadedCardsContainer = document.getElementById('uploadedCardsContainer');

    // === АВТОРИЗАЦІЯ ===
    async function checkSession() {
        const { data: { session } } = await supabase.auth.getSession();
        if (session) {
            showAdminPanel();
        } else {
            loginPanel.style.display = 'block';
            adminPanel.style.display = 'none';
        }
    }
    checkSession();

    loginBtn.addEventListener('click', async () => {
        loginBtn.disabled = true;
        loginBtn.textContent = 'Вхід...';
        loginError.style.display = 'none';

        const email = loginEmail.value.trim();
        const password = loginPassword.value;
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });

        if (error) {
            loginError.textContent = 'Помилка: ' + error.message;
            loginError.style.display = 'block';
            loginBtn.disabled = false;
            loginBtn.textContent = 'Увійти';
        } else {
            showAdminPanel();
        }
    });

    function showAdminPanel() {
        loginPanel.style.display = 'none';
        adminPanel.style.display = 'block';
    }

    logoutBtn.addEventListener('click', async () => {
        await supabase.auth.signOut();
        window.location.reload();
    });

    // === ФУНКЦІЯ ОЧИЩЕННЯ НАЗВИ ===
    function cleanTitle(rawTitle) {
        if (!rawTitle) return 'Без назви';
        return rawTitle
            .replace(/\.(mp4|mkv|avi|mov)$/i, '')
            .replace(/(^|[_\s-])(no|de)?logo([_\s-]|$)/gi, '$1')
            .replace(/_/g, ' ')
            .replace(/\s+/g, ' ')
            .trim();
    }

    // === ЧЕРГА ЗАВАНТАЖЕННЯ ВІДЕО (ПРЯМО В B2) ===
    let uploadQueue = [];
    let isUploading = false;

    dropZone.addEventListener('click', () => videoFileInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.background = 'rgba(59, 130, 246, 0.15)'; });
    dropZone.addEventListener('dragleave', () => { dropZone.style.background = 'rgba(59, 130, 246, 0.05)'; });
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.style.background = 'rgba(59, 130, 246, 0.05)';
        enqueueFiles(e.dataTransfer.files);
    });
    videoFileInput.addEventListener('change', (e) => {
        enqueueFiles(e.target.files);
        videoFileInput.value = '';
    });

    function enqueueFiles(fileListObj) {
        const files = Array.from(fileListObj).filter(f => f.type.startsWith('video/'));
        if (files.length === 0) return;
        uploadQueue.push(...files);
        processQueue();
    }

    async function processQueue() {
        if (isUploading) return;
        isUploading = true;
        
        while (uploadQueue.length > 0) {
            const file = uploadQueue.shift();
            await handleFileUpload(file); 
        }
        
        isUploading = false;
    }

    // === ЗАВАНТАЖЕННЯ ВІДЕО ===
    function handleFileUpload(file) {
        return new Promise((resolve) => {
            const progressContainer = document.getElementById('uploadProgress');
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');

            progressContainer.style.display = 'block';
            progressBar.style.width = '0%';
            progressBar.style.background = '#22c55e';
            progressText.textContent = `Підготовка: ${file.name}`;

            fetch(`https://banderizzation-backend.onrender.com/api/get-upload-url?fileName=${encodeURIComponent(file.name)}&mimeType=${encodeURIComponent(file.type)}`)
                .then(res => res.json())
                .then(data => {
                    if (data.error) throw new Error(data.error);

                    progressText.textContent = `Завантажуємо в B2 (0%): ${file.name}`;

                    const xhr = new XMLHttpRequest();
                    xhr.open('PUT', data.url, true);
                    xhr.setRequestHeader('Content-Type', file.type);

                    xhr.upload.onprogress = (event) => {
                        if (event.lengthComputable) {
                            const percent = Math.round((event.loaded / event.total) * 100);
                            progressBar.style.width = percent + '%';
                            progressText.textContent = `Завантажуємо в B2 (${percent}%): ${file.name}`;
                        }
                    };

                    xhr.onload = async () => {
                        if (xhr.status === 200) {
                            let cleanTitleText = cleanTitle(file.name);
                            const tableName = contentTypeSelect.value;
                            
                            const { data: dbData, error: dbError } = await supabase
                                .from(tableName)
                                .insert([{ title: cleanTitleText, description: '', posterUrl: '', videoFileName: file.name, views: 0, likes: 0 }])
                                .select();

                            if (dbError) {
                                progressText.textContent = `Помилка бази: ${dbError.message}`;
                                progressBar.style.background = '#ef4444';
                            } else {
                                createEditCard(dbData[0], tableName);
                                progressText.textContent = `Успішно завантажено: ${cleanTitleText}`;
                            }
                        } else {
                            progressText.textContent = `Помилка B2: ${xhr.status}`;
                            progressBar.style.background = '#ef4444';
                        }
                        resolve();
                    };

                    xhr.onerror = () => {
                        progressText.textContent = `Помилка мережі`;
                        progressBar.style.background = '#ef4444';
                        resolve();
                    };

                    xhr.send(file);
                })
                .catch(err => {
                    progressText.textContent = `Помилка: ${err.message}`;
                    progressBar.style.background = '#ef4444';
                    resolve();
                });
        });
    }

    // === ЗАВАНТАЖЕННЯ ПОСТЕРА ===
       async function uploadPoster(file, recordId, tableName, statusText, posterInput) {
        statusText.textContent = 'Завантаження...';
        statusText.style.color = '#38ff3b';

        // Генеруємо унікальне ім'я файлу, щоб уникнути конфліктів
        const fileExt = file.name.split('.').pop();
        const fileName = `${recordId}_${Date.now()}.${fileExt}`;

        try {
            // Завантажуємо напряму в Supabase Storage
            const { data, error } = await supabase.storage
                .from('posters')
                .upload(fileName, file, {
                    cacheControl: '3600',
                    upsert: false
                });

            if (error) throw error;

            // Отримуємо публічне посилання
            const { data: urlData } = supabase.storage
                .from('posters')
                .getPublicUrl(fileName);

            const publicUrl = urlData.publicUrl;

            // Оновлюємо поле та базу
            posterInput.value = publicUrl;
            statusText.textContent = '✅ Постер завантажено!';
            statusText.style.color = '#22c55e';
            
            await supabase.from(tableName).update({ posterUrl: publicUrl }).eq('id', recordId);

        } catch (error) {
            console.error('Помилка завантаження постера:', error);
            statusText.textContent = '❌ Помилка завантаження';
            statusText.style.color = '#ef4444';
        }
    }

    // === КАРТКА РЕДАГУВАННЯ ===
    function createEditCard(record, tableName) {
        const card = document.createElement('div');
        card.className = 'uploaded-card';
        card.dataset.id = record.id;
        card.dataset.table = tableName;

        card.innerHTML = `
            <h3>🎬 ${record.title}</h3>
            <label>Назва</label>
            <input type="text" class="card-title-input" value="${(record.title || '').replace(/"/g, '&quot;')}">
            <label>Опис</label>
            <textarea class="card-desc-input" rows="2">${record.description || ''}</textarea>
            
            <label>Постер</label>
            <div class="poster-drop-zone">
                <span class="poster-status-text">Перетягніть картинку сюди або клікніть</span>
                <input type="file" class="poster-file-input" accept="image/*" style="display: none;">
            </div>
            <input type="text" class="card-poster-input" placeholder="URL постера" value="${(record.posterUrl || '').replace(/"/g, '&quot;')}">
            
            <div class="card-actions">
                <button class="btn-save">💾 Зберегти</button>
            </div>
            <div class="save-status"></div>
        `;

        const titleInput = card.querySelector('.card-title-input');
        const descInput = card.querySelector('.card-desc-input');
        const posterInput = card.querySelector('.card-poster-input');
        const saveBtn = card.querySelector('.btn-save');
        const statusEl = card.querySelector('.save-status');

        const dropZonePoster = card.querySelector('.poster-drop-zone');
        const fileInputPoster = card.querySelector('.poster-file-input');
        const statusTextPoster = card.querySelector('.poster-status-text');

        dropZonePoster.addEventListener('click', () => fileInputPoster.click());
        dropZonePoster.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZonePoster.style.background = 'rgba(59, 130, 246, 0.1)';
        });
        dropZonePoster.addEventListener('dragleave', () => {
            dropZonePoster.style.background = 'transparent';
        });
        dropZonePoster.addEventListener('drop', async (e) => {
            e.preventDefault();
            dropZonePoster.style.background = 'transparent';
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                await uploadPoster(file, record.id, tableName, statusTextPoster, posterInput);
            }
        });
        fileInputPoster.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (file) {
                await uploadPoster(file, record.id, tableName, statusTextPoster, posterInput);
            }
            fileInputPoster.value = '';
        });

        saveBtn.addEventListener('click', async () => {
            saveBtn.disabled = true;
            statusEl.textContent = 'Збереження...';
            statusEl.style.color = '#94a3b8';

            const { error } = await supabase
                .from(tableName)
                .update({
                    title: titleInput.value,
                    description: descInput.value,
                    posterUrl: posterInput.value
                })
                .eq('id', record.id);

            if (error) {
                statusEl.textContent = 'Помилка: ' + error.message;
                statusEl.style.color = '#ef4444';
            } else {
                statusEl.textContent = '✅ Збережено';
                statusEl.style.color = '#22c55e';
                card.querySelector('h3').textContent = `🎬 ${titleInput.value}`;
            }
            saveBtn.disabled = false;
        });

        uploadedCardsContainer.prepend(card);
    }

    // === КЕРУВАННЯ ВІКНОМ ===
    openManageBtn.addEventListener('click', async () => {
        manageModal.style.display = 'flex';
        modalWindow.style.width = '80%';
        modalWindow.style.height = '70vh';
        await loadFilesForManagement();
    });

    function closeModal() {
        manageModal.style.display = 'none';
        fileList.innerHTML = '';
        modalStatus.textContent = 'Завантаження списку...';
    }

    closeModalBtn.addEventListener('click', closeModal);
    cancelModalBtn.addEventListener('click', closeModal);

    let isMinimized = false;
    minimizeBtn.addEventListener('click', () => {
        isMinimized = !isMinimized;
        modalWindow.style.height = isMinimized ? '50px' : '70vh';
        minimizeBtn.textContent = isMinimized ? '□' : '_';
    });

    let isMaximized = false;
    maximizeBtn.addEventListener('click', () => {
        isMaximized = !isMaximized;
        modalWindow.style.width = isMaximized ? '100%' : '80%';
        modalWindow.style.height = isMaximized ? '100%' : '70vh';
        maximizeBtn.textContent = isMaximized ? '❐' : '□';
    });

    // === СПИСОК ФАЙЛІВ ===
    async function loadFilesForManagement() {
        const tableName = contentTypeSelect.value;
        modalStatus.textContent = 'Завантаження...';
        fileList.innerHTML = '';

        const { data, error } = await supabase
            .from(tableName)
            .select('id, title, videoFileName')
            .order('title', { ascending: true });

        if (error) {
            modalStatus.textContent = 'Помилка завантаження списку.';
            return;
        }

        if (!data || data.length === 0) {
            modalStatus.textContent = 'У цій таблиці ще немає файлів.';
            return;
        }

        modalStatus.textContent = `Знайдено файлів: ${data.length}`;

        data.forEach(item => {
            const li = document.createElement('li');
            li.className = 'file-item';
            const safeTitle = (item.title || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            const safeFile = (item.videoFileName || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            li.innerHTML = `
                <input type="checkbox" value="${item.id}" data-filename="${safeFile}">
                <div class="file-info">
                    <strong>${safeTitle}</strong>
                    <span>${safeFile}</span>
                </div>
            `;
            fileList.appendChild(li);
        });
    }

    // === ВИДАЛЕННЯ ===
    deleteSelectedBtn.addEventListener('click', async () => {
        const checkboxes = fileList.querySelectorAll('input[type="checkbox"]:checked');
        if (checkboxes.length === 0) {
            alert('Оберіть хоча б один файл.');
            return;
        }

        if (!confirm(`Видалити ${checkboxes.length} файлів? Вони зникнуть з бази та Backblaze.`)) return;

        deleteSelectedBtn.disabled = true;
        modalStatus.textContent = 'Видалення...';

        const tableName = contentTypeSelect.value;
        let successCount = 0;
        let errorCount = 0;

        try {
            for (const cb of checkboxes) {
                const id = cb.value;
                const fileName = cb.dataset.filename;

                try {
                    if (fileName) {
                        const response = await fetch(`https://banderizzation-backend.onrender.com/api/delete-video?fileName=${encodeURIComponent(fileName)}`, {
                            method: 'DELETE'
                        });
                        if (!response.ok) throw new Error('Помилка B2');
                    }

                    const { error } = await supabase.from(tableName).delete().eq('id', id);
                    if (error) throw error;

                    successCount++;
                    cb.closest('.file-item').remove();
                } catch (error) {
                    console.error(`Помилка видалення ${fileName}:`, error);
                    errorCount++;
                }
            }
        } finally {
            deleteSelectedBtn.disabled = false;
            modalStatus.textContent = `Видалено: ${successCount}. Помилок: ${errorCount}.`;
        }
    });
</script>

</body>
</html>
