<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мультоскоп — BanderiZZation!</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="player.css">
    <script>document.documentElement.className += ' bz-pre';</script>
    <link rel="icon" type="image/png" sizes="144x144" href="favicon.png">
    
    <style>
        /* Стилі для екрану завантаження плеєра */
        #loadingOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 15, 25, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-radius: 8px;
            color: #38ff3b;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .spinner {
            border: 4px solid rgba(56, 255, 59, 0.2);
            border-top: 4px solid #38ff3b;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #loadingOverlay p {
            margin: 5px 0;
            font-size: 1.1rem;
            text-align: center;
        }
        #loadingOverlay small {
            color: #94a3b8;
            font-size: 0.85rem;
        }
    </style>
</head>
<body class="sub-page page-multoskop page-player" data-collection="cartoons" data-label="Мультоскоп" data-empty="Схоже, мультфільмів у базі ще немає...">

    <div class="sub-wrap">
        <a class="back-link" href="index.html">← До хабу</a>

        <section class="glass-panel">
            <h2 class="sub-title">🎞️ Мультоскоп</h2>
            <p class="sub-text">Українські мультфільми які ви ніколи не бачили!</p>
            <div id="movies-container" class="movies-grid">
                <p class="sub-text" style="color: #00f2fe;">Завантаження мультфільмів...</p>
            </div>
        </section>
    </div>

    <!-- Вікно плеєра з коментарями (логіка та стилі — player.js / player.css) -->
    <div id="videoModal" class="player-modal" aria-hidden="true">
        <div class="player-box">
            <button class="player-close" id="closePlayerBtn" aria-label="Закрити">×</button>
            <div class="video-wrapper" style="position: relative;">
                <!-- Екран завантаження -->
                <div id="loadingOverlay" style="display: none;">
                    <div class="spinner"></div>
                    <p>Зачекайте...</p>
                    <small>Генеруємо безпечні ключі для доступу до відео</small>
                </div>

                <iframe id="playerIframe" src="about:blank" allow="autoplay; fullscreen" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true"></iframe>
            </div>

            <div class="info-row">
                <span class="meta-item">👁️ <span id="modalViews">0</span></span>
                <button class="like-btn" id="modalLikeBtn">🔥 <span id="modalLikes">0</span></button>
                <span style="color: rgba(255,255,255,0.4)">•</span>
                <h3 class="modal-movie-title" id="modalTitle">Назва</h3>
            </div>

            <p class="player-desc" id="modalDescription"></p>

            <!-- Гілка коментарів -->
            <div class="chat-section">
                <h3 class="chat-title">Коментарі до мультфільму</h3>

                <div class="form-group">
                    <label for="chatEmail">Пошта</label>
                    <input type="email" id="chatEmail" class="chat-input" placeholder="name@gmail.com" maxlength="254" autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="chatText">Коментар</label>
                    <textarea id="chatText" class="chat-textarea" rows="3" maxlength="500" placeholder="Ваш коментар (до 500 символів)"></textarea>
                    <div class="chat-counter" id="charCounter">0 / 500</div>
                </div>

                <!-- Поле-пастка від ботів -->
                <input id="chatWebsite" type="text" tabindex="-1" autocomplete="off" aria-hidden="true" class="hp-field">

                <button class="submit-chat-btn" id="sendCommentBtn" type="button">Надіслати</button>
                <div class="chat-status" id="chatStatus" role="status" aria-live="polite"></div>

                <div class="chat-list" id="modalCommentsList"></div>
            </div>
        </div>
    </div>

    <script src="common.js"></script>
    <script src="player.js"></script>

    <!-- Скрипт для додавання шестерні в меню -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(() => {
                const controls = document.querySelector('.top-controls');
                if (controls) {
                    const adminLink = document.createElement('a');
                    adminLink.href = 'admin.html';
                    adminLink.innerHTML = '⚙️';
                    adminLink.title = 'Адмін-панель';
                    adminLink.className = 'control-badge';
                    adminLink.style.textDecoration = 'none';
                    adminLink.style.display = 'flex';
                    adminLink.style.alignItems = 'center';
                    adminLink.style.justifyContent = 'center';
                    adminLink.style.padding = '0.2rem 0.6rem';
                    adminLink.style.fontSize = '1rem';
                    controls.appendChild(adminLink);
                }
            }, 100);
        });
    </script>
</body>
</html>
